name: OMG Image Builder
on:
  workflow_dispatch: # This is the magic line that gives you the "Run" button
  push:
    branches:
      - OMG

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            bison \
            gawk \
            qemu-user-static \
            debootstrap \
            flex \
            libssl-dev \
            bc \
            rsync \
            kmod \
            cpio \
            xz-utils \
            fakeroot \
            parted \
            udev \
            dosfstools \
            device-tree-compiler \
            debhelper \
            dh-python \
            python3-dev \
            libelf-dev \
            pkg-config

      - name: Cache Build Directory
        uses: actions/cache@v4
        with:
          path: |
            build/
            .ccache
          # The 'key' changes if your board config or scripts change
          key: ${{ runner.os }}-omg-build-${{ hashFiles('config/boards/omg.sh', 'scripts/omg-setup.sh') }}
          # The 'restore-keys' allows using the most recent cache even if the key doesn't match perfectly
          restore-keys: |
            ${{ runner.os }}-omg-build-

      - name: 🧹 Global Line-Ending Sanitizer
        run: |
          echo "Stripping Windows CRLF from all files..."
          find . -type f -exec sed -i 's/\r//g' {} +

      - name: 🔑 Set Script Permissions
        run: |
          echo "Enabling execution for build scripts..."
          # Explicitly target the main build script in the root
          [ -f "./build.sh" ] && chmod +x ./build.sh
          
          # Target scripts in the sub-directory by path
          if [ -d "scripts" ]; then
            find scripts/ -type f -name "*.sh" -exec chmod +x {} +
          fi

          echo "Enabling execution for OMG CLI modules..."
          # Target the overlay scripts by their full path from the root
          if [ -d "overlay/usr/local/bin" ]; then
            chmod +x overlay/usr/local/bin/*
          fi

      - name: Build OMG Image
        run: |
          # 1. Define Local Variables
          U_PKG="u-boot-radxa-rk3588"
          U_TGT="radxa-rk3588"
          U_CFG="rock-5a-rk3588_defconfig"

          # 2. 🔍 Debug: Print exactly what we are about to inject
          echo "------------------------------------------------"
          echo "💉 Preparing Direct Variable Injection:"
          echo "Targeting Package: '$U_PKG'"
          echo "Targeting Target:  '$U_TGT'"
          echo "Targeting Config:  '$U_CFG'"
          echo "------------------------------------------------"

          # 3. 🔥 THE FORCE INJECTION
          # We pass variables inline so sudo cannot strip them
          echo "🛠️ Compiling U-Boot..."
          sudo U_BOOT_PACKAGE="$U_PKG" U_BOOT_TARGET="$U_TGT" U_BOOT_CONFIG="$U_CFG" ./scripts/build-u-boot.sh rock-5a
          
          # 4. Create the 'omg' alias link
          echo "🔗 Linking Radxa U-Boot to OMG..."
          cd build
          ln -sf u-boot-rock-5a_*.deb u-boot-omg_99.99_arm64.deb
          cd ..

          # 5. Final Image Build using the same injection
          echo "🚀 Starting main image build..."
          sudo U_BOOT_PACKAGE="$U_PKG" U_BOOT_TARGET="$U_TGT" U_BOOT_CONFIG="$U_CFG" ./build.sh --board=omg --suite=noble --flavor=server

      - name: Debug Build Directory on Failure
        if: failure() # 👈 This only runs if the step above fails
        run: |
          echo "❌ Build failed. Displaying directory structure for troubleshooting:"
          echo "---------------------------------------------------------------"
          # Install tree if not present, then show 'build' and 'config' structures
          sudo apt-get install -y tree > /dev/null
          tree -L 3 build/
          echo "---------------------------------------------------------------"
          echo "Checking Board Configs:"
          ls -R config/boards/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMG-Installer-Image
          path: build/*.img.xz
