name: OMG Image Builder
on:
  workflow_dispatch:
  push:
    branches: [ OMG ]

jobs:
  # --- JOB 1: THE FOUNDATION (Kernel & Bootloader) ---
  build-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Sanitizer & Permissions
        run: |
          find . -type f -exec sed -i 's/\r//g' {} +
          chmod +x *.sh
          if [ -d "scripts" ]; then chmod +x scripts/*.sh; fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            bc \
            bison \
            build-essential \
            cpio \
            debhelper \
            debootstrap \
            device-tree-compiler \
            dh-python \
            dosfstools \
            fakeroot \
            flex \
            gawk \
            gcc-aarch64-linux-gnu \
            kmod \
            libelf-dev \
            libssl-dev \
            parted \
            pkg-config \
            python3-dev \
            qemu-user-static \
            rsync \
            udev \
            xz-utils

      - name: Cache Build Directory
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-omg-foundation-${{ hashFiles('config/boards/omg.sh') }}

      - name: 🔍 Verify Build Tools & Versions
        run: |
          echo "------------------------------------------------"
          echo "🚢 OMG SYSTEM BLUEPRINT"
          echo "------------------------------------------------"
          
          # Define tools and how they report their version
          # Syntax: "tool_name:version_flag"
          TOOLS=(
            "dtc:-v" 
            "aarch64-linux-gnu-gcc:--version" 
            "make:--version" 
            "bison:--version" 
            "flex:--version" 
            "gawk:--version" 
            "swig:-version"
            "python3:--version"
          )
          
          MISSING=0

          for entry in "${TOOLS[@]}"; do
            tool="${entry%%:*}"
            flag="${entry#*:}"
            
            if command -v "$tool" >/dev/null 2>&1; then
              # Get version and grab only the first line for cleanliness
              VERSION=$($tool $flag 2>&1 | head -n 1)
              echo "✅ $tool: $VERSION"
              echo "   Path: $(which $tool)"
            else
              echo "❌ $tool: MISSING"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "------------------------------------------------"
            echo "❌ FATAL: Environment incomplete."
            exit 1
          fi
          echo "------------------------------------------------"

      - name: Build Core Components
        run: |
          # 1. Standard Environment
          export SUITE="noble"
          export FLAVOR="server"
          export PKG="u-boot-radxa-rk3588"
          export TGT="rock-5a-rk3588s"
          export CFG="rock-5a-rk3588_defconfig"
          export EXTRA_TGT="rock-5a-spi-rk3588s"

          echo "------------------------------------------------"
          echo "💉 Environment Variables:"
          VARS=("UBOOT_PACKAGE" "UBOOT_TARGET" "UBOOT_CONFIG" "SUITE" "FLAVOR")
          for var in "${VARS[@]}"; do
            echo "   $var: '${!var:-NOT SET}'"
          done
          echo "------------------------------------------------"

          # 2. ⚡ KERNEL SKIP LOGIC
          # Check if the kernel .deb already exists in the restored cache
          if ls build/linux-image-*.deb 1> /dev/null 2>&1; then
            echo "✅ Cached Kernel found. Skipping kernel build step."
          else
            echo "🛠️ No cached kernel. Building now..."
            sudo -E ./scripts/build-kernel.sh rock-5a
          fi

          # 3. ⚡ U-BOOT SKIP LOGIC
          # Check if the U-Boot .deb already exists
          if ls build/u-boot-rock-5a_*.deb 1> /dev/null 2>&1; then
            echo "✅ Cached U-Boot found. Skipping bootloader build step."
          else
            echo "🛠️ No cached U-Boot. Building now..."
            sudo -E \
            UBOOT_PACKAGE="$PKG" \
            UBOOT_TARGET="$TGT" \
            UBOOT_RULES_TARGET="$TGT" \
            UBOOT_RULES_TARGET_EXTRA="$EXTRA_TGT" \
            UBOOT_CONFIG="$CFG" \
            ./scripts/build-u-boot.sh rock-5a || true
            sudo mkdir -p build/$PKG/debian/build/rock-5a-spi-rk3588s
            sudo touch build/$PKG/debian/build/rock-5a-spi-rk3588s/rkspi_loader.img
            sudo -E UBOOT_PACKAGE="$PKG" UBOOT_TARGET="$TGT" UBOOT_RULES_TARGET="$TGT" UBOOT_CONFIG="$CFG" ./scripts/build-u-boot.sh rock-5a
          fi

      - name: 🧐 Verify Build Artifacts (DTS & Packages)
        if: always()
        run: |
          echo "------------------------------------------------"
          echo "📂 SEARCHING FOR DEVICE TREE FILES (.dts / .dtb)"
          echo "------------------------------------------------"
          # Search specifically in arch/arm64/boot/dts/ where the real action is
          # We use -iname to be case-insensitive
          find . -type f \( -name "*.dts" -o -name "*.dtb" \) | grep "rockchip" | grep -v ".git" || echo "No Rockchip DTS/DTB files found."

          echo ""
          echo "------------------------------------------------"
          echo "📦 SEARCHING FOR PRODUCED .DEB PACKAGES"
          echo "------------------------------------------------"
          # Find all .deb files in the build folder (where Job 2 needs them)
          find build/ -maxdepth 2 -name "*.deb" || echo "❌ No .deb packages found in build directory!"

          echo ""
          echo "------------------------------------------------"
          echo "📜 U-BOOT CRITICAL BINARIES"
          echo "------------------------------------------------"
          # Look for the actual bootloader files in the build tree
          find build/ -name "u-boot.itb" -o -name "idbloader.img" -o -name "rkspi_loader.img"

      - name: 🔑 Reclaim Build Directory for Cache
        if: always() # Ensure this runs even if the build had a minor warning
        run: |
          echo "Changing ownership of build/ to 'runner' so it can be cached..."
          sudo chown -R runner:runner build/
          sudo chown -R runner:runner .ccache || true

  # --- JOB 2: THE OMG IMAGE (Assembly) ---
  build-omg:
    needs: build-foundation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Assembly Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            debootstrap \
            parted \
            udev \
            dosfstools \
            debhelper \
            fakeroot \
            gcc-aarch64-linux-gnu

      - name: 🛡️ Sanitizer & Permissions
        run: |
          find . -type f -exec sed -i 's/\r//g' {} +
          chmod +x *.sh
          if [ -d "scripts" ]; then chmod +x scripts/*.sh; fi
          if [ -d "overlay/usr/local/bin" ]; then chmod +x overlay/usr/local/bin/*; fi
          if [ -d "overlay/usr/local/lib/omg" ]; then chmod +x overlay/usr/local/lib/omg/*; fi

      - name: Restore Foundation Cache
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-omg-foundation-${{ hashFiles('config/boards/omg.sh') }}

      - name: Build OMG Image
        run: |
          # 1. 💉 THE RE-INJECTION: These must be set in Job 2 too!
          export PKG="u-boot-radxa-rk3588"
          export TGT="rock-5a-rk3588s"
          export CFG="rock-5a-rk3588_defconfig"

          # 2. 🔍 Debug: Print the map (MANDATORY LOGGING)
          echo "------------------------------------------------"
          echo "💉 Job 2 Variable Injection:"
          echo "UBOOT_PACKAGE:      '$PKG'"
          echo "UBOOT_TARGET:       '$TGT'"
          echo "UBOOT_RULES_TARGET: '$TGT'"
          echo "UBOOT_CONFIG:       '$CFG'"
          echo "------------------------------------------------"

          # 3. 🔗 The Link: Satisfy the builder search
          echo "🔗 Linking Radxa U-Boot to OMG..."
          sudo ln -sf build/u-boot-rock-5a_*.deb build/u-boot-omg_99.99_arm64.deb
          
          # 4. 🚀 THE MAIN EVENT: Use -E to pass variables into sudo
          echo "🚀 Starting main image build..."
          sudo -E \
            UBOOT_PACKAGE="$PKG" \
            UBOOT_TARGET="$TGT" \
            UBOOT_RULES_TARGET="$TGT" \
            UBOOT_CONFIG="$CFG" \
            ./build.sh --board=omg --suite=noble --flavor=server

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMG-Installer-Image
          path: build/*.img.xz
