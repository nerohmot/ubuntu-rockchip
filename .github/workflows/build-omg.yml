name: OMG Image Builder
on:
  workflow_dispatch:
  push:
    branches: [ OMG ]

jobs:
  # --- JOB 1: THE FOUNDATION (Kernel & Bootloader) ---
  build-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Sanitizer & Permissions
        run: |
          echo "🔍 Stripping Windows line endings (CRLF → LF)..."
          CRLF_FILES=$(grep -rlU $'\r' --include="*.sh" --include="*.yml" --include="*.md" . 2>/dev/null | grep -v ".git" || true)
          if [ -n "$CRLF_FILES" ]; then
            echo "$CRLF_FILES" | while read -r f; do echo "  🔧 Fixed: $f"; done
            echo "$CRLF_FILES" | xargs sed -i 's/\r//g'
          else
            echo "  ✅ No CRLF files found."
          fi

          echo "🔍 Setting execute permissions on shell scripts..."
          CHMOD_FILES=$(find . -name "*.sh" ! -perm -u+x | grep -v ".git" || true)
          if [ -n "$CHMOD_FILES" ]; then
            echo "$CHMOD_FILES" | while read -r f; do echo "  🔧 chmod +x: $f"; done
            echo "$CHMOD_FILES" | xargs chmod +x
          else
            echo "  ✅ All scripts already executable."
          fi

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            debhelper \
            debootstrap \
            device-tree-compiler \
            dh-python \
            dosfstools \
            fakeroot \
            flex \
            gawk \
            gcc-aarch64-linux-gnu \
            kmod \
            libelf-dev \
            libssl-dev \
            parted \
            pkg-config \
            python3-dev \
            qemu-user-static \
            rsync \
            swig \
            udev \
            xz-utils

      - name: 💾 Cache Build Directory
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-omg-foundation-${{ hashFiles('config/boards/omg.sh', 'config/suites/noble.sh', 'dts/rk3588s-omg.dts') }}

      - name: 🔍 Verify Build Tools
        run: |
          # Define tools and how they report their version
          # Syntax: "tool_name:version_flag"
          TOOLS=(
            "dtc:-v" 
            "aarch64-linux-gnu-gcc:--version" 
            "make:--version" 
            "bison:--version" 
            "flex:--version" 
            "gawk:--version" 
            "swig:-version"
            "python3:--version"
          )
          
          MISSING=0

          for entry in "${TOOLS[@]}"; do
            tool="${entry%%:*}"
            flag="${entry#*:}"
            
            if command -v "$tool" >/dev/null 2>&1; then
              # Get version and grab only the first non-empty line for cleanliness
              VERSION=$($tool $flag 2>&1 | grep -v '^[[:space:]]*$' | head -n 1)
              echo "✅ $tool: $(which $tool) ($VERSION)"
            else
              echo "❌ $tool: MISSING"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            exit 1
          fi

      - name: ⚙️ Build Core Components
        run: |
          # 1. Standard Environment
          export SUITE="noble"
          export FLAVOR="server"
          export PKG="u-boot-radxa-rk3588"
          export TGT="radxa-nx5-io-rk3588s"
          export CFG="radxa-nx5-io-rk3588s_defconfig"

          echo "------------------------------------------------"
          echo "💉 Environment Variables:"
          VARS=("PKG" "TGT" "CFG" "SUITE" "FLAVOR")
          for var in "${VARS[@]}"; do
            echo "   $var: '${!var:-NOT SET}'"
          done
          echo "------------------------------------------------"

          # 2. ⚡ KERNEL SKIP LOGIC
          # Check if the kernel .deb already exists in the restored cache
          if ls build/linux-image-*.deb 1> /dev/null 2>&1; then
            echo "✅ Cached Kernel found. Skipping kernel build step."
          else
            echo "🛠️ No cached kernel. Building now..."
            sudo -E SUITE="$SUITE" ./scripts/build-kernel.sh
          fi

          # 3. ⚡ U-BOOT SKIP LOGIC
          # Check if the U-Boot .deb already exists
          if ls build/u-boot-radxa-nx5-io_*.deb 1> /dev/null 2>&1; then
            echo "✅ Cached U-Boot found. Skipping bootloader build step."
          else
            echo "🛠️ No cached U-Boot. Building now..."
            sudo -E \
            UBOOT_PACKAGE="$PKG" \
            UBOOT_TARGET="$TGT" \
            UBOOT_RULES_TARGET="$TGT" \
            UBOOT_CONFIG="$CFG" \
            ./scripts/build-u-boot.sh
          fi

      - name: 🧐 Verify Build Artifacts (DTS & Packages)
        if: always()
        run: |
          echo "------------------------------------------------"
          echo "📂 SEARCHING FOR DEVICE TREE FILES (.dts / .dtb)"
          echo "------------------------------------------------"
          # Search specifically in arch/arm64/boot/dts/ where the real action is
          # We use -iname to be case-insensitive
          find . -type f \( -name "*.dts" -o -name "*.dtb" \) | grep "rockchip" | grep -v ".git" || echo "No Rockchip DTS/DTB files found."

          echo ""
          echo "------------------------------------------------"
          echo "📦 SEARCHING FOR PRODUCED .DEB PACKAGES"
          echo "------------------------------------------------"
          # Find all .deb files in the build folder (where Job 2 needs them)
          find build/ -maxdepth 2 -name "*.deb" || echo "❌ No .deb packages found in build directory!"

          echo ""
          echo "------------------------------------------------"
          echo "📜 U-BOOT CRITICAL BINARIES"
          echo "------------------------------------------------"
          # Look for the actual bootloader files in the build tree
          find build/ -name "u-boot.itb" -o -name "idbloader.img" -o -name "rkspi_loader.img"

      - name: 🔑 Reclaim Build Directory for Cache
        if: always() # Ensure this runs even if the build had a minor warning
        run: |
          echo "Changing ownership of build/ to 'runner' so it can be cached..."
          sudo chown -R runner:runner build/
          sudo chown -R runner:runner .ccache || true

  # --- JOB 2: THE OMG IMAGE (Assembly) ---
  build-omg:
    needs: build-foundation
    runs-on: ubuntu-24.04
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Install Assembly Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            debootstrap \
            parted \
            udev \
            dosfstools \
            debhelper \
            fakeroot \
            gcc-aarch64-linux-gnu \
            kmod \
            rsync \
            xz-utils

      - name: 🛡️ Sanitizer & Permissions
        run: |
          echo "🔍 Stripping Windows line endings (CRLF → LF)..."
          CRLF_FILES=$(grep -rlU $'\r' --include="*.sh" --include="*.yml" --include="*.md" . 2>/dev/null | grep -v ".git" || true)
          if [ -n "$CRLF_FILES" ]; then
            echo "$CRLF_FILES" | while read -r f; do echo "  🔧 Fixed: $f"; done
            echo "$CRLF_FILES" | xargs sed -i 's/\r//g'
          else
            echo "  ✅ No CRLF files found."
          fi

          echo "🔍 Setting execute permissions on shell scripts..."
          CHMOD_FILES=$(find . -name "*.sh" ! -perm -u+x | grep -v ".git" || true)
          if [ -n "$CHMOD_FILES" ]; then
            echo "$CHMOD_FILES" | while read -r f; do echo "  🔧 chmod +x: $f"; done
            echo "$CHMOD_FILES" | xargs chmod +x
          else
            echo "  ✅ All scripts already executable."
          fi

          echo "🔍 Setting execute permissions on overlay binaries..."
          OVERLAY_FILES=$(find overlay/usr/local/bin overlay/usr/local/lib/omg -type f ! -perm -u+x 2>/dev/null || true)
          if [ -n "$OVERLAY_FILES" ]; then
            echo "$OVERLAY_FILES" | while read -r f; do echo "  🔧 chmod +x: $f"; done
            echo "$OVERLAY_FILES" | xargs chmod +x
          else
            echo "  ✅ All overlay binaries already executable."
          fi

      - name: ♻️ Restore Foundation Cache
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-omg-foundation-${{ hashFiles('config/boards/omg.sh', 'config/suites/noble.sh', 'dts/rk3588s-omg.dts') }}

      - name: 🚢 Build OMG Image
        run: |
          # 1. 💉 THE RE-INJECTION: These must be set in Job 2 too!
          export PKG="u-boot-radxa-rk3588"
          export TGT="radxa-nx5-io-rk3588s"
          export CFG="radxa-nx5-io-rk3588s_defconfig"

          # 2. 🔍 Debug: Print the map (MANDATORY LOGGING)
          echo "------------------------------------------------"
          echo "💉 Job 2 Variable Injection:"
          echo "UBOOT_PACKAGE:      '$PKG'"
          echo "UBOOT_TARGET:       '$TGT'"
          echo "UBOOT_RULES_TARGET: '$TGT'"
          echo "UBOOT_CONFIG:       '$CFG'"
          echo "------------------------------------------------"

          # 3. 🔗 The Link: Satisfy the builder search
          echo "🔗 Linking NX5 IO U-Boot to OMG..."
          (cd build && sudo ln -sf u-boot-radxa-nx5-io_*.deb u-boot-omg_99.99_arm64.deb)
          
          # 4. 🚀 THE MAIN EVENT: Use -E to pass variables into sudo
          echo "🚀 Starting main image build..."
          sudo -E \
            UBOOT_PACKAGE="$PKG" \
            UBOOT_TARGET="$TGT" \
            UBOOT_RULES_TARGET="$TGT" \
            UBOOT_CONFIG="$CFG" \
            ./build.sh --board=omg --suite=noble --flavor=server

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMG-Installer-Image
          path: images/*.img.xz
