name: OMG Image Builder
on:
  workflow_dispatch: # This is the magic line that gives you the "Run" button
  push:
    branches:
      - OMG

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            bison \
            gawk \
            qemu-user-static \
            debootstrap \
            flex \
            libssl-dev \
            bc \
            rsync \
            kmod \
            cpio \
            xz-utils \
            fakeroot \
            parted \
            udev \
            dosfstools \
            device-tree-compiler \
            debhelper \
            dh-python \
            python3-dev \
            libelf-dev \
            pkg-config

      - name: Cache Build Directory
        uses: actions/cache@v4
        with:
          path: |
            build/
            .ccache
          # The 'key' changes if your board config or scripts change
          key: ${{ runner.os }}-omg-build-${{ hashFiles('config/boards/omg.sh', 'scripts/omg-setup.sh') }}
          # The 'restore-keys' allows using the most recent cache even if the key doesn't match perfectly
          restore-keys: |
            ${{ runner.os }}-omg-build-

      - name: Build OMG Image
        run: |
          # 1. Run the build
          sudo ./build.sh --board=omg --suite=noble --flavor=server || true

          # 2. If it failed because it couldn't find the .deb, let's fix it manually
          if [ ! -f build/u-boot-omg_*.deb ]; then
            echo "🔧 Manually linking U-Boot package..."
            sudo ln -s $(ls build/u-boot-radxa-rk3588_*.deb | head -n 1) build/u-boot-omg_1.0_arm64.deb
          fi

          # 3. Resume the build to finish the image
          sudo ./build.sh --board=omg --suite=noble --flavor=server

      - name: Debug Build Directory on Failure
        if: failure() # 👈 This only runs if the step above fails
        run: |
          echo "❌ Build failed. Displaying directory structure for troubleshooting:"
          echo "---------------------------------------------------------------"
          # Install tree if not present, then show 'build' and 'config' structures
          sudo apt-get install -y tree > /dev/null
          tree -L 3 build/
          echo "---------------------------------------------------------------"
          echo "Checking Board Configs:"
          ls -R config/boards/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMG-Installer-Image
          path: build/*.img.xz
