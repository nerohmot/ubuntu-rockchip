name: OMG Image Builder
on:
  workflow_dispatch:
  push:
    branches: [ OMG ]

jobs:
  # --- JOB 1: THE FOUNDATION (Kernel & Bootloader) ---
  build-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Sanitizer & Permissions
        run: |
          find . -type f -exec sed -i 's/\r//g' {} +
          chmod +x *.sh
          if [ -d "scripts" ]; then chmod +x scripts/*.sh; fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            debhelper \
            debootstrap \
            device-tree-compiler \
            dh-python \
            dosfstools \
            fakeroot \
            flex \
            gawk \
            gcc-aarch64-linux-gnu \
            kmod \
            libelf-dev \
            libssl-dev \
            parted \
            pkg-config \
            python3-dev \
            qemu-user-static \
            rsync \
            udev \
            xz-utils

      - name: Cache Build Directory
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-omg-foundation-${{ hashFiles('config/boards/omg.sh') }}

      - name: Build Core Components
        run: |
          # 1. Standard Environment
          export SUITE="noble"
          export FLAVOR="server"
          export PKG="u-boot-radxa-rk3588"
          export TGT="rock-5a-rk3588s"
          export CFG="rock-5a-rk3588_defconfig"
          
          # 2. 🔥 THE PERMANENT FIX: 
          # We tell the 'rules' file to build the SPI target as an 'extra'
          # This ensures 'rkspi_loader.img' is actually compiled and exists
          export EXTRA_TGT="rock-5a-spi-rk3588s"

          # 3. Build Kernel
          sudo -E ./scripts/build-kernel.sh rock-5a
          
          # 4. Build U-Boot (Properly this time)
          # We pass UBOOT_RULES_TARGET_EXTRA so the Makefile builds BOTH targets
          sudo -E \
            UBOOT_PACKAGE="$PKG" \
            UBOOT_TARGET="$TGT" \
            UBOOT_RULES_TARGET="$TGT" \
            UBOOT_RULES_TARGET_EXTRA="$EXTRA_TGT" \
            UBOOT_CONFIG="$CFG" \
            ./scripts/build-u-boot.sh rock-5a

  # --- JOB 2: THE OMG IMAGE (Assembly) ---
  build-omg:
    needs: build-foundation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Sanitizer & Permissions
        run: |
          find . -type f -exec sed -i 's/\r//g' {} +
          chmod +x *.sh
          if [ -d "scripts" ]; then chmod +x scripts/*.sh; fi
          if [ -d "overlay/usr/local/bin" ]; then chmod +x overlay/usr/local/bin/*; fi
          if [ -d "overlay/usr/local/lib/omg" ]; then chmod +x overlay/usr/local/lib/omg/*; fi

      - name: Restore Foundation Cache
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-omg-foundation-${{ hashFiles('config/boards/omg.sh') }}

      - name: Build OMG Image
        run: |
          # --- MANDATORY LOGGING ---
          export PKG="u-boot-radxa-rk3588"
          export TGT="rock-5a-rk3588s"
          export SUITE="noble"
          export FLAVOR="server"
          echo "------------------------------------------------"
          echo "💉 Finalizing Build with Full Environment Injection:"
          echo "UBOOT_PACKAGE: '$PKG'"
          echo "SUITE:         '$SUITE'"
          echo "------------------------------------------------"

          # 1. Link the bootloader
          sudo ln -sf $(ls build/u-boot-rock-5a_*.deb | head -n 1) build/u-boot-omg_99.99_arm64.deb
          
          # 2. 🔥 THE NVIDIA BYPASS
          export APT_OPTIONS="--no-install-recommends --no-install-suggests"

          # 3. Final Build
          sudo -E UBOOT_PACKAGE="$PKG" ./build.sh --board=omg --suite=$SUITE --flavor=$FLAVOR

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMG-Installer-Image
          path: build/*.img.xz
